---
ROBOT:
  frame_height: 0.78
  front_x: 0.30
  back_x: -0.50
  width: 0.40
VLAD:
  n_clusters: 8
  cache_dir: 'dino_clusters/VITB_not_turnpike_8'
  model: "dinov2_vitb14"
  desc_layer: 10
ONLINE_CLUSTERING:
  cluster_similarity_threshold: .65
  subcluster_similarity_threshold: .5
  pair_similarity_maximum: 1.0
  # n_clusters: 3
  # sname: 'context_clusters/DINO_IM224_ln10_CROP_20_feats_holdout_2_not_turnpike_reduced'
  # cluster_similarity_threshold: .5
  # subcluster_similarity_threshold: .3
  # pair_similarity_maximum: 1.0
  # n_vectors: 10000
BEHAVIOR:
  mode_filter_size: 10
  buffer_size: 200
  speed_init: 1.5
  max_cost: .32
  max_velocity: 2
  velocity_margin: .3 #high on bag playback since we don't control speed
  adaptation_factor: .001
  speed_cap: 5.5 # ??? not used!
  weighted_avg_speed: False
  residual_max: 26.0
  uncertainty_threshold: .90 # 0.85
  buffer_update_freq: 2
  cost_lengthscale: 3.0
  speed_lengthscale: 1.5
  train_kernel: False
  costmap_cvar: .03
  unknown_cost: 0.5
  unknown_speed: 1.0
  maxpool_speedmap: True
MISC:
  update_freq: 5
  image_size: 224

# Runtime profiling synchronizes CUDA at every timing mark by default.
# Disable it for production; this does not change costmap calculations.
PROFILE:
  enable: false


