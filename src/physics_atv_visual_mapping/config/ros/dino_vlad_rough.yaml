image:
    image_topic: /rough/D435_1/color/image_raw
    camera_info_topic: /rough/D435_1/color/camera_info
    image_compressed: False

pointcloud:
    topic: /livox/lidar_filtered
    frame: aft_mapped #comment this line out if your pointcloud frame is already a child of your odom frame. we set this of own internal frame conventions.

odometry:
    topic: /aft_mapped_to_init

gridmap:
    topic: local_gridmap

intrinsics:
    K: [454.6972351074219, 0., 325.50006103515625, 0., 454.3711853027344, 185.2296600341797, 0., 0., 1.]
    P: [454.6972351074219, 0., 325.50006103515625, 0., 454.3711853027344, 185.2296600341797, 0., 0., 1.]

extrinsics:
    p: [0.03609, 0.06487, 0.00196]
    q: [0.48952, -0.49251, 0.50911, 0.50853] #xyzw

    # p: [0.17265, -0.15227, 0.05708]
    # q: [0.55940, -0.54718, 0.44603, 0.43442] #xyzw


image_processing:
    -
        type: dino
        args:
            dino_type: dinov2_vitb14
            dino_layer: 10
            image_insize: [686, 364] #this should be the size of the input images
            desc_facet: value
#            desc_facet: token

    -
        type: vlad
        args:
            n_clusters: 8
            cache_dir: /home/zenith/salon_ros2_ws/install/physics_atv_visual_mapping/share/physics_atv_visual_mapping/data/dino_clusters/8_clusters_364x686_

localmapping:
    layer_key: VLAD
    ema: 0.15 #higher->use recent more
    metadata:
        # origin: [-40., -40.]
        # length_x: 80.
        # length_y: 80.
        # resolution: 0.5

       # origin: [-25., -25.]
       # length_x: 50.
       # length_y: 50.
       # resolution: 0.1999

       origin: [-20., -20.]
       length_x: 40.
       length_y: 40.
       resolution: 0.1999

       # origin: [-20., -20.]
       # length_x: 40.
       # length_y: 40.
       # resolution: 0.125

slope:
    enable: true
    
device: cuda
#viz: True
viz: False

PROFILE:
    # Short diagnostic mode. cuda_sync gives accurate GPU-stage timings but
    # lowers throughput slightly; set it false after locating the bottleneck.
    enable: false
    period: 10
    warn_ms: 250.0
    cuda_sync: false
    topk: 10
    ema_alpha: 0.10
    hz_window: 30

PERFORMANCE:
    use_amp: true
    publish_dino_pcl: false
    publish_dino_image: false
    publish_rgb_viz: false
    log_frame_timing: false
    pcl_viz_stride: 4

click_vlad:
    # Average a 3x3 patch in the 23x12 VLAD feature grid.
    radius_feat: 1
    display_scale: 1.0
    residual_max: 19.0